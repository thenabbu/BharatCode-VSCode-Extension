<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="BharatCode for VS Code - the VS Code extension for bharatcode.ai, with qwen-3.8-27b and deepseek-v4.1-flash">
  <title>BharatCode for VS Code</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a35" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ff6a35" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#038fac" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a35"/>
      <stop offset="55%" stop-color="#e1ba00"/>
      <stop offset="100%" stop-color="#038fac"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.42" cy="-0.1" r="1.05">
      <stop offset="0%" stop-color="#2e2724" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f0a07" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2e2724" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="720" height="480" fill="#0f0a07"/>
  <rect width="720" height="480" fill="url(#grid)"/>
  <rect width="720" height="480" fill="url(#vig)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <text x="48" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="16" fill="#a39a95" letter-spacing="2">MIT · NO TELEMETRY</text>

  <g transform="translate(48 88) scale(0.20)">
    <g fill="none" stroke="#ff6a35" stroke-width="54" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M194 142 84 256l110 114"/>
      <path d="m318 142 110 114-110 114"/>
    </g>
    <path fill="#ff6a35" d="m256 221 35 35-35 35-35-35z"/>
  </g>

  <text x="140" y="176" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="650" fill="#fef9f7" letter-spacing="-1.2">BharatCode</text>

  <text x="48" y="226" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="22" fill="#dbd2cd">The VS Code extension for</text>
  <text x="48" y="256" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="22" fill="#dbd2cd">bharatcode.ai</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
    <rect x="48" y="292" rx="8" width="300" height="48" fill="#1c1410" stroke="#b44012" stroke-width="2"/>
    <text x="66" y="323" fill="#ff936f">qwen-3.8-27b</text>
    <text x="330" y="323" fill="#817874" font-size="17" text-anchor="end">262k</text>

    <rect x="364" y="292" rx="8" width="308" height="48" fill="#1c1410" stroke="#005c70" stroke-width="2"/>
    <text x="382" y="323" fill="#6bcde9">deepseek-v4.1-flash</text>
    <text x="654" y="323" fill="#817874" font-size="17" text-anchor="end">1M</text>

    <rect x="48" y="352" rx="8" width="200" height="48" fill="#1c1410" stroke="#453e3a" stroke-width="2"/>
    <text x="66" y="383" fill="#dbd2cd" font-size="17">one endpoint</text>
  </g>

  <rect x="48" y="432" width="624" height="3" rx="1.5" fill="url(#rule)"/>
</svg>
