<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Request path: VS Code webview to extension host to a bundled local backend on loopback, then to the bharatcode.ai API">
  <title>How a prompt travels</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#817874"/>
    </marker>
    <linearGradient id="trust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7e3a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a7e3a" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" fill="#fef9f7"/>

  <!-- local trust boundary -->
  <rect x="24" y="86" width="556" height="128" rx="14" fill="url(#trust)" stroke="#0a7e3a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0a7e3a" letter-spacing="1.1">YOUR MACHINE</text>

  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <!-- webview -->
    <rect x="48" y="130" width="150" height="66" rx="10" fill="#ffffff" stroke="#dbd2cd" stroke-width="1.5"/>
    <text x="123" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1410">Webview</text>
    <text x="123" y="180" text-anchor="middle" font-size="12" fill="#5e5652">chat UI · SolidJS</text>

    <!-- ext host -->
    <rect x="238" y="130" width="150" height="66" rx="10" fill="#ffffff" stroke="#dbd2cd" stroke-width="1.5"/>
    <text x="313" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1410">Extension host</text>
    <text x="313" y="180" text-anchor="middle" font-size="12" fill="#5e5652">spawns the child</text>

    <!-- backend -->
    <rect x="428" y="130" width="132" height="66" rx="10" fill="#fff4f1" stroke="#e05015" stroke-width="1.8"/>
    <text x="494" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#b44012">Local backend</text>
    <text x="494" y="178" text-anchor="middle" font-size="11.5" font-family="ui-monospace,Menlo,monospace" fill="#8b310f">127.0.0.1</text>

    <!-- arrows local -->
    <line x1="200" y1="163" x2="232" y2="163" stroke="#817874" stroke-width="2" marker-end="url(#a)"/>
    <text x="216" y="150" text-anchor="middle" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#817874">msg</text>
    <line x1="390" y1="163" x2="422" y2="163" stroke="#817874" stroke-width="2" marker-end="url(#a)"/>
    <text x="406" y="150" text-anchor="middle" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#817874">HTTP</text>

    <!-- API -->
    <rect x="672" y="130" width="240" height="66" rx="10" fill="#0f0a07" stroke="#e05015" stroke-width="1.8"/>
    <text x="792" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#fef9f7">bharatcode.ai</text>
    <text x="792" y="178" text-anchor="middle" font-size="11.5" font-family="ui-monospace,Menlo,monospace" fill="#ff936f">/api/model/v1</text>

    <line x1="564" y1="163" x2="664" y2="163" stroke="#817874" stroke-width="2" marker-end="url(#a)"/>
    <text x="614" y="150" text-anchor="middle" font-size="10.5" font-family="ui-monospace,Menlo,monospace" fill="#817874">HTTPS</text>
    <text x="614" y="186" text-anchor="middle" font-size="10.5" fill="#5e5652">SANDBOX →</text>

    <text x="48" y="246" font-size="13" fill="#5e5652">Loopback only, random per-session password. Nothing on your network can reach the backend.</text>
    <text x="672" y="246" font-size="13" fill="#5e5652">Your key goes only here.</text>
  </g>
</svg>
